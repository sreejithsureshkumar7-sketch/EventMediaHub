<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in • EventMediaHub</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .auth-tabs{display:flex;gap:8px;margin:18px 0}
    .auth-tab{flex:1;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:inherit;border-radius:12px;padding:10px;cursor:pointer}
    .auth-tab.active{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3)}
    .auth-form{display:grid;gap:10px}
    .auth-form input{width:100%;box-sizing:border-box;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:inherit;outline:none}
    .auth-form input::placeholder{color:rgba(255,255,255,.55)}
    .divider{display:flex;align-items:center;gap:10px;margin:16px 0;color:rgba(255,255,255,.5);font-size:13px}
    .divider::before,.divider::after{content:"";height:1px;background:rgba(255,255,255,.12);flex:1}
    .hidden{display:none!important}
    #message{min-height:20px;margin:10px 0;font-size:13px}
  </style>
</head>
<body class="center-page">
  <div class="glass auth-card">
    <a class="brand" href="index.html">Event<span>Media</span>Hub</a>
    <div class="auth-icon">✦</div>
    <h1 id="title">Welcome back</h1>
    <p id="subtitle">Sign in to join events and share memories.</p>

    <div class="auth-tabs">
      <button id="loginTab" class="auth-tab active" type="button">Login</button>
      <button id="signupTab" class="auth-tab" type="button">Create account</button>
    </div>

    <form id="authForm" class="auth-form">
      <input id="name" class="hidden" type="text" placeholder="Full name" autocomplete="name">
      <input id="email" type="email" placeholder="Email address" autocomplete="email" required>
      <input id="password" type="password" placeholder="Password (minimum 6 characters)" autocomplete="current-password" minlength="6" required>
      <button id="submitBtn" class="btn primary full" type="submit">Login</button>
    </form>

    <div class="divider">or</div>
    <button id="googleBtn" class="btn full" type="button">Continue with Google</button>
    <div id="message" class="muted"></div>
    <p class="muted">For Google login, enable Google provider in Supabase. You can also create an account with email and password.</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const loginTab = document.querySelector('#loginTab');
    const signupTab = document.querySelector('#signupTab');
    const nameInput = document.querySelector('#name');
    const emailInput = document.querySelector('#email');
    const passwordInput = document.querySelector('#password');
    const authForm = document.querySelector('#authForm');
    const submitBtn = document.querySelector('#submitBtn');
    const googleBtn = document.querySelector('#googleBtn');
    const title = document.querySelector('#title');
    const subtitle = document.querySelector('#subtitle');
    const message = document.querySelector('#message');
    let signupMode = false;

    function setMode(isSignup) {
      signupMode = isSignup;
      loginTab.classList.toggle('active', !isSignup);
      signupTab.classList.toggle('active', isSignup);
      nameInput.classList.toggle('hidden', !isSignup);
      nameInput.required = isSignup;
      submitBtn.textContent = isSignup ? 'Create account' : 'Login';
      title.textContent = isSignup ? 'Create your account' : 'Welcome back';
      subtitle.textContent = isSignup
        ? 'Create an EventMediaHub account to join college events.'
        : 'Sign in to join events and share memories.';
      message.textContent = '';
    }

    loginTab.onclick = () => setMode(false);
    signupTab.onclick = () => setMode(true);

    authForm.onsubmit = async (e) => {
      e.preventDefault();
      message.textContent = 'Please wait...';
      submitBtn.disabled = true;
      try {
        if (signupMode) {
          const data = await EMH.auth.signUpEmail(
            nameInput.value.trim(),
            emailInput.value.trim(),
            passwordInput.value
          );
          if (data.session) {
            location.href = 'events.html';
          } else {
            message.textContent = 'Account created. Check your email to confirm your account, then login.';
          }
        } else {
          await EMH.auth.signInEmail(emailInput.value.trim(), passwordInput.value);
          location.href = 'events.html';
        }
      } catch (err) {
        message.textContent = err?.message || 'Authentication failed.';
      } finally {
        submitBtn.disabled = false;
      }
    };

    googleBtn.onclick = async () => {
      message.textContent = 'Opening Google login...';
      googleBtn.disabled = true;
      try {
        await EMH.auth.signInGoogle();
      } catch (err) {
        message.textContent = err?.message || 'Google login failed. You can use email/password instead.';
        googleBtn.disabled = false;
      }
    };
  </script>
</body>
</html>
