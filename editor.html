</header><main class="container"><section class="page-head"><div><span class="eyebrow">CREATIVE STUDIO</span><h1>Video editor</h1><p>Trim, add music/text, apply a basic filter, then export MP4 in your browser.</p></div></section><section class="editor-layout"><div class="glass video-stage"><video id="previewVideo" controls></video><div id="editorStatus" class="status">Choose a video to begin.</div></div><form id="editorForm" class="glass pad controls"><label>Video<input id="videoInput" type="file" accept="video/*" required></label><label>Start seconds<input id="startTime" type="number" min="0" step=".1" value="0"></label><label>End seconds<input id="endTime" type="number" min="0" step=".1"></label><label>Overlay text<input id="overlayText" maxlength="80" placeholder="Campus Fest 2026"></label><label>Music<input id="musicInput" type="file" accept="audio/*"></label><label>Filter<select id="filter"><option value="none">Original</option><option value="grayscale">Grayscale</option><option value="warm">Warm</option><option value="vintage">Vintage</option></select></label><button class="btn primary full">Render & Export MP4</button></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script><script src="https://unpkg.com/@ffmpeg/util@0.11.1/dist/ffmpeg.min.js"></script><script src="js/supabase.js"></script><script src="js/auth.js"></script><script src="js/app.js"></script><script src="js/editor.js"></script></body></html>
