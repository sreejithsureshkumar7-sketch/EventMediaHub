<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event • EventMediaHub</title><link rel="stylesheet" href="styles.css"></head><body data-page="event"><header class="topbar">
<a class="brand" href="events.html">Event<span>Media</span>Hub</a>
<nav><a href="events.html">Events</a><a href="admin.html">Admin</a></nav>
<div class="user-chip"><img data-user-avatar src="https://placehold.co/40x40/png" alt=""><span data-user-name>User</span><button data-signout class="icon-btn">↪</button></div>
</header><main class="container"><section id="eventHero" class="glass event-hero"></section><section class="split"><div class="glass pad"><h2>Join this event</h2><p>Scan the event QR on another screen, or use the camera scanner below.</p><div id="reader" class="qr-reader"></div><button id="scanBtn" class="btn primary full">Start QR Scanner</button><div class="divider">OR</div><button id="joinBtn" class="btn ghost full">Join Current Event</button></div><div class="glass pad"><h2>Event QR</h2><div id="qrCanvas" class="qr-box"></div><small data-qr-url></small></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script><script src="js/supabase.js"></script><script src="js/auth.js"></script><script src="js/app.js"></script><script src="js/events.js"></script><script src="js/qr.js"></script><script>
(async()=>{const guard=await EMH.pageGuard(); if(!guard)return; let e; try{e=EMH.getEventId()?await EMH.events.byId(EMH.getEventId()):await EMH.events.byCode(EMH.getJoinCode()||"")}catch(x){document.querySelector("#eventHero").innerHTML="<h1>Event not found</h1>";return}
document.querySelector("#eventHero").innerHTML="<span class='pill'>"+(new Date(e.ends_at)>new Date()?"LIVE":"EXPIRED")+"</span><h1>"+EMH.escape(e.name)+"</h1><p>"+EMH.escape(e.description||"")+"</p><small>"+EMH.escape(e.venue||"")+" • "+EMH.formatDate(e.starts_at)+"</small><div class='actions'><a class='btn primary' href='gallery.html?event="+e.id+"'>Open Gallery</a><a class='btn ghost' href='editor.html?event="+e.id+"'>Video Editor</a></div>";
EMH.qr.render(document.querySelector("#qrCanvas"),e);
document.querySelector("#joinBtn").onclick=async()=>{try{await EMH.events.join(e.id);EMH.toast("Joined event","success");location.href="gallery.html?event="+e.id}catch(x){EMH.toast(x.message,"error")}};
document.querySelector("#scanBtn").onclick=async()=>{try{await EMH.qr.scan(document.querySelector("#reader"))}catch(x){EMH.toast(x.message,"error")}};
})();
</script></body></html>
